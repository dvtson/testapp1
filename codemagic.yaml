workflows:
  ios-testflight:
    name: Build & Publish to TestFlight
    integrations:
      app_store_connect: "1app"
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      groups:
        # Bạn cần tạo biến môi trường trong giao diện Codemagic
        # Đặt tên group là "appstore_credentials" hoặc tích hợp trực tiếp Apple Developer Portal
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Expo Prebuild (Tạo mã nguồn native iOS)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up Code Signing
        script: |
          keychain initialize
          # Tự động lấy certificate và provisioning profile từ App Store Connect
          # (Có cờ --create để Codemagic tự tạo cert nếu bạn dùng Windows và không có file .p12)
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/1app.xcworkspace" \
            --scheme "1app"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Sử dụng Apple Developer integration được cấu hình trên Codemagic
        auth: integration
        submit_to_testflight: true
